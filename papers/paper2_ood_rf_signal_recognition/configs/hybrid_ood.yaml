paper:
  title: Uncertainty-Calibrated Multi-View RF Signal Recognition for Open-Set Electromagnetic Spectrum Monitoring
  short_name: paper2_hybrid_ood

protocol:
  name: hybrid_ood
  description: Evaluate the union of held-out classes and held-out deployment domains.

artifacts:
  # Replace with the converted OpenEW-SA artifact directory for the selected dataset.
  artifact_dir: 'D:\openew_sa_data\processed\openew_combined'
  metadata_file: metadata.csv
  feature_file: features.npy
  labels_file: labels.json

views:
  enabled:
    - iq
    - psd
    - spectrogram
    - tabular
  fusion: uncertainty_aware_late_fusion
  missing_view_policy: mask_missing

target:
  label_column: situation_label
  domain_column: domain_id

split:
  protocol: hybrid_ood
  known_classes: []
  ood_classes: []
  train_domains: []
  id_domains: []
  ood_domains: []
  validation_fraction: 0.15
  test_fraction: 0.20
  seed: 42

model:
  name: multi_view_rf_encoder
  uncertainty:
    - temperature_scaling
    - max_softmax_probability
    - predictive_entropy
    - energy_score
    - ensemble_variance

outputs:
  split_dir: 'D:\openew_sa_data\paper2\splits\hybrid_ood'
  run_dir: runs/paper2_hybrid_ood
  table_dir: 'D:\openew_sa_data\paper2\tables'
  figure_dir: 'D:\openew_sa_data\paper2\figures'

notes:
  - Fill known_classes, ood_classes, train_domains, and ood_domains from selected artifacts.
  - Model-specific multi-view artifact loading is a future integration point.
