paper:
  title: Uncertainty-Calibrated Multi-View RF Signal Recognition for Open-Set Electromagnetic Spectrum Monitoring
  short_name: paper2_class_ood

protocol:
  name: class_ood
  description: Hold out RF labels as unknown classes while training on known classes.

artifacts:
  # Replace with the converted OpenEW-SA artifact directory for the selected dataset.
  artifact_dir: 'D:\openew_sa_data\processed\radioml'
  metadata_file: metadata.csv
  feature_file: features.npy
  labels_file: labels.json

views:
  enabled:
    - iq
    - psd
    - spectrogram
  fusion: late_fusion
  missing_view_policy: mask_missing

target:
  label_column: modulation_label
  domain_column: domain_id

split:
  protocol: class_ood
  known_classes: []
  ood_classes: []
  validation_fraction: 0.15
  test_fraction: 0.20
  seed: 42

model:
  name: multi_view_rf_encoder
  uncertainty:
    - temperature_scaling
    - max_softmax_probability
    - predictive_entropy
    - energy_score

outputs:
  split_dir: 'D:\openew_sa_data\paper2\splits\class_ood'
  run_dir: runs/paper2_class_ood
  table_dir: 'D:\openew_sa_data\paper2\tables'
  figure_dir: 'D:\openew_sa_data\paper2\figures'

notes:
  - Fill known_classes and ood_classes after inspecting labels.json or metadata.csv.
  - Model-specific multi-view artifact loading is a future integration point.
